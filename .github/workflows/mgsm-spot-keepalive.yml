name: mgsm-spot-keepalive (resume spot training)

# Keeps a resumable MGSM (Market Graph State Model) walk-forward training run
# alive on interruptible spot GPUs. Every ~15 min (and on manual dispatch):
#   DONE sentinel in S3?          -> nothing to do, run finished
#   a spot box already running?   -> nothing to do, still training
#   otherwise                     -> launch one via market_state/scripts/mgsm-spot-train.sh
#
# Crash-loop guard: tracks the checkpoint "epoch" (= last completed fold index)
# across ticks in s3://$BUCKET/checkpoints/<job>/keepalive-state.json. After 3
# consecutive launches with NO fold progress, or 48 h wall-clock, it writes a
# FAILED DONE and stops relaunching (one SNS notification).
#
# Auth: GitHub OIDC -> role alpaquero-gh-launcher. One-time setup:
#   market_state/scripts/setup_mgsm_spot_infra.sh   (admin AWS creds)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Job slug (S3 checkpoint prefix)"
        required: true
        default: mgsm-shake
        type: string
      cmd:
        description: "Trainer command (cwd=/root/repo). Do NOT add --out/--s3-prefix/--resume."
        required: true
        default: "python market_state/scripts/train.py --config market_state/configs/crypto.yaml --features /root/features.npz --device cuda --max-folds 4 --max-epochs 20 --patience 5 --min-epochs 3"
        type: string
      reset:
        description: "Clear DONE + keepalive-state before this tick (restart a finished/failed run)"
        required: false
        default: false
        type: boolean
      data:
        description: "features.npz S3 key"
        required: false
        default: "datasets/mgsm/features.npz"
        type: string
      branch:
        description: "repo branch the box clones"
        required: false
        default: "main"
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: mgsm-spot-keepalive
  cancel-in-progress: false

env:
  BUCKET: noshore-eeg-benchmarks-827938107865
  # scheduled ticks run the 4-fold SHAKEDOWN. Once it writes DONE the cron goes
  # idle. For the full ~23-fold run: dispatch with -f job=mgsm -f reset=true and
  # the full --max-epochs 40 command (no --max-folds), or bump these defaults.
  DEFAULT_JOB: mgsm-shake
  DEFAULT_CMD: "python market_state/scripts/train.py --config market_state/configs/crypto.yaml --features /root/features.npz --device cuda --max-folds 4 --max-epochs 20 --patience 5 --min-epochs 3"
  MAX_STALL: "3"
  MAX_HOURS: "24"

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::827938107865:role/alpaquero-gh-launcher
          aws-region: us-east-1

      - name: Tick
        env:
          IN_JOB: ${{ inputs.job }}
          IN_CMD: ${{ inputs.cmd }}
          IN_RESET: ${{ inputs.reset }}
          IN_DATA: ${{ inputs.data }}
          IN_BRANCH: ${{ inputs.branch }}
          SNS_TOPIC_ARN: arn:aws:sns:us-east-1:827938107865:eeg-runs
        run: |
          set -euo pipefail
          JOB="${IN_JOB:-$DEFAULT_JOB}"
          CMD="${IN_CMD:-$DEFAULT_CMD}"
          PFX="s3://$BUCKET/checkpoints/$JOB"
          now=$(date -u +%s)

          if [ "${IN_RESET:-false}" = "true" ]; then
            echo "reset: clearing DONE + keepalive-state for $JOB"
            aws s3 rm "$PFX/DONE" || true
            aws s3 rm "$PFX/keepalive-state.json" || true
          fi

          if aws s3 ls "$PFX/DONE" >/dev/null 2>&1; then
            echo "DONE exists -- run complete. Nothing to do."
            exit 0
          fi

          RUNNING=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=alpaquero" "Name=tag:spot-job,Values=$JOB" \
                      "Name=instance-state-name,Values=pending,running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ -n "$RUNNING" ]; then
            echo "box $RUNNING already training $JOB. Nothing to do."
            exit 0
          fi

          EPOCH=-1
          if aws s3 cp "$PFX/progress.json" /tmp/progress.json >/dev/null 2>&1; then
            EPOCH=$(python3 -c "import json;print(json.load(open('/tmp/progress.json'))['epoch'])")
          fi
          SEEN=-1; STALL=0; FIRST=$now
          if aws s3 cp "$PFX/keepalive-state.json" /tmp/state.json >/dev/null 2>&1; then
            SEEN=$(python3 -c "import json;print(json.load(open('/tmp/state.json')).get('seen_epoch',-1))")
            STALL=$(python3 -c "import json;print(json.load(open('/tmp/state.json')).get('stall',0))")
            FIRST=$(python3 -c "import json;print(json.load(open('/tmp/state.json')).get('first_ts',$now))")
          fi

          if [ "$EPOCH" -gt "$SEEN" ]; then
            STALL=0; SEEN=$EPOCH
          else
            STALL=$((STALL + 1))
          fi
          HOURS=$(( (now - FIRST) / 3600 ))
          echo "fold=$EPOCH seen=$SEEN stall=$STALL hours=$HOURS"

          if [ "$STALL" -ge "$MAX_STALL" ] || [ "$HOURS" -ge "$MAX_HOURS" ]; then
            REASON="stall=$STALL hours=$HOURS"
            echo "giving up: $REASON"
            printf 'FAILED %s\n' "$REASON" > /tmp/DONE
            aws s3 cp /tmp/DONE "$PFX/DONE"
            aws sns publish --topic-arn "$SNS_TOPIC_ARN" \
              --subject "mgsm-spot-keepalive gave up on $JOB" \
              --message "$REASON -- see $PFX/" || true
            exit 0
          fi

          python3 -c "import json;json.dump({'seen_epoch':$SEEN,'stall':$STALL,'first_ts':$FIRST},open('/tmp/state.json','w'))"
          aws s3 cp /tmp/state.json "$PFX/keepalive-state.json"

          echo "launching spot box for $JOB (folds done so far: $EPOCH)"
          bash market_state/scripts/mgsm-spot-train.sh --job "$JOB" --cmd "$CMD" \
            --data "${IN_DATA:-datasets/mgsm/features.npz}" \
            --branch "${IN_BRANCH:-main}"
