[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "market-state"
version = "0.1.0"
description = "Multivariate financial-market state model (CWT -> WCT -> Hermitian graph -> spectral -> Mamba-3)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.2",
    "matplotlib>=3.7",
    "python-dotenv>=1.0",
    "alpaca-py>=0.9",
    "mambapy>=1.2.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
